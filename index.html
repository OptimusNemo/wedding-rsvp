<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7d252d">
  <title>Wedding RSVP | Punam weds Subhojit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">A LITTLE NOTE FOR YOU</p>
    <p class="intro">We'd love to celebrate with you</p>
    <h1>Punam <span>weds</span> Subhojit</h1>
    <div class="rule" aria-hidden="true">✦</div>
    <p class="date">30 January 2027 <span>·</span> 6 PM onwards</p>
    <p class="venue">JMS Villa, Kolkata</p>

    <form id="rsvp-form">
      <label for="guest-name">Your name</label>
      <input id="guest-name" name="name" type="text" maxlength="100"
             placeholder="Please enter your name" autocomplete="name" required>

      <fieldset>
        <legend>Will you be joining us for the celebration?</legend>
        <label class="choice">
          <input type="radio" name="response" value="YES" required>
          <span class="choice-box"><strong>YES</strong><small>I'll be there!</small></span>
        </label>
        <label class="choice">
          <input type="radio" name="response" value="NO" required>
          <span class="choice-box"><strong>NO</strong><small>Sorry, can't make it</small></span>
        </label>
      </fieldset>

      <!-- Honeypot field: leave empty. Helps deter basic automated spam. -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button id="submit-button" type="submit">Send RSVP</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="footer">Looking forward to seeing you!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
